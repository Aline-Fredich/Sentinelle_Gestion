services:
  sentinel-gestion:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-gestion:1.0.0
    container_name: sentinel-gestion-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=SENTINEL GESTION
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_DEFAULT_LOCALE=fr-FR
      - NEXT_PUBLIC_DEFAULT_TIMEZONE=Europe/Paris
      - NEXT_PUBLIC_DEFAULT_CURRENCY=EUR
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
